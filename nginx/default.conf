# ==============================================================================
# Nginx 站点配置（php-fpm）
# 挂载位置：./nginx/default.conf -> /etc/nginx/conf.d/default.conf
#
# 根目录 = web-ui/ 的内容（挂在容器的 /var/www/html）
# ==============================================================================

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php;

    charset utf-8;
    client_max_body_size 8m;

    # -------------------------------------------------------------------------
    # 安全：不要把源码 / 配置 / 文档当静态文件吐出去
    # （本项目是私密照片站，暴露源码只会白送攻击面）
    # -------------------------------------------------------------------------
    location = /config.php {
        return 404;
    }

    location ^~ /src/ {
        return 404;
    }

    location ~* \.(md|json|ya?ml|lock|sql|log|sh|py|ini)$ {
        return 404;
    }

    # Let's Encrypt 校验目录（如果以后要签证书，别被下面的 dotfile 规则挡住）
    location ^~ /.well-known/acme-challenge/ {
        allow all;
    }

    location ~ /\. {
        deny all;
    }

    # -------------------------------------------------------------------------
    # 静态资源
    #
    # 注意 no-cache 这条：ES module 之间是「裸导入」（import './theme.js'），
    # 没法像 index.php 那样逐个文件加 ?v=mtime。如果不强制协商校验，升级后
    # 浏览器可能仍在跑旧模块 —— 表现就是「改了没生效」。
    # no-cache 不等于不缓存：仍会走 ETag/Last-Modified，未改动时是 304。
    # -------------------------------------------------------------------------
    location ~* ^/assets/.*\.(js|css)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* ^/assets/.*\.(svg|png|jpe?g|webp|ico|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # PHP-FPM
    # -------------------------------------------------------------------------

    # 图片是流式输出的大响应：关掉缓冲，避免整张图先落到磁盘/内存再发给客户端
    location = /image.php {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
        # 防止执行不存在的 .php（否则任何路径都能塞给 FPM）
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # 其余交给前端控制器
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
